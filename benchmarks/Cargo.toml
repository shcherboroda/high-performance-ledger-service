[package]
name = "ledger-benchmarks"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[[bin]]
name = "ledger-benchmark"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls", "uuid"] }
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "time", "sync"] }
uuid = { version = "1.19", features = ["v4", "v5", "serde"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.15"
